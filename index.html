<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zadaci i bilješke</title>
<style>
  :root {
    --bg: #347FC4;
    --ink: #333133;
    --muted: #0a0a0a;
    --grid: #ffffff21;
    --accent: #0a0a0a;
    --sans: "Hanken Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --label: "Space Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --gutter: 45px;
    --cols: 9;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans);
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button { -webkit-tap-highlight-color: transparent; transition: transform .16s ease, color .16s ease, background-color .16s ease, border-color .16s ease; }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  button:active:not(:disabled) { transform: scale(.97); }

  .caps { font-family: var(--label); font-size: .82rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 500; }

  /* zaglavlje */
  header {
    margin: 0 var(--gutter); height: 68px; border-bottom: 1px solid var(--ink);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .logo { font-family: var(--label); font-weight: 700; font-size: 1.5rem; letter-spacing: .01em; text-decoration: none; }
  .account { display: flex; align-items: center; gap: 14px; }
  .account-email { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  nav { display: flex; gap: clamp(18px, 4vw, 66px); }
  nav a { text-decoration: none; padding: 6px 0; position: relative; }
  nav a::after { content: ""; position: absolute; left: 0; bottom: 0; height: 1px; width: 0; background: var(--ink); transition: width .25s; }
  nav a:hover::after { width: calc(100% - .32em); }

  /* okvir s vertikalnim linijama */
  .frame {
    position: relative; margin: 14px var(--gutter) 0; min-height: calc(100svh - 82px);
    border-left: 1px solid var(--grid); border-right: 1px solid var(--grid);
    background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px);
    background-size: calc(100% / var(--cols)) 100%;
    padding: 24px clamp(24px, 5vw, 88px) 28px;
    display: flex; flex-direction: column;
    background-color: rgba(255, 255, 255, .035);
  }
  .content { max-width: 900px; width: 100%; }

  .eyebrow { line-height: 2.1; }
  .eyebrow::after { content: ""; display: block; width: 51px; height: 1px; background: var(--ink); margin-top: 18px; }


  h1 {
    font-weight: 600; letter-spacing: -.055em; line-height: .98; margin: clamp(36px, 7vh, 86px) 0 0;
    font-size: clamp(2.9rem, 8.2vw, 6.4rem);
  }
  h1 span { display: block; color: var(--muted); }

  /* unos */
  form { margin-top: clamp(32px, 6vh, 64px); display: grid; gap: 18px; }
  .title-input, .field {
    background: transparent; border: 0; border-bottom: 1px solid var(--ink); border-radius: 0;
    color: var(--ink); font-family: var(--sans); padding: 10px 0; outline: none; width: 100%;
  }
  .title-input { font-size: clamp(1.35rem, 2.4vw, 1.8rem); font-weight: 500; letter-spacing: -.02em; }
  .title-input::placeholder, .field::placeholder { color: var(--muted); opacity: 1; }
  .title-input:focus, .field:focus { border-bottom-color: var(--accent); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .field { font-size: 1.05rem; }
  select.field { appearance: none; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 9px) 55%, calc(100% - 4px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }

  .cta { display: inline-flex; align-items: center; gap: clamp(18px, 4vw, 52px); background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); width: fit-content; transition: transform .16s ease; }
  .circle {
    width: 62px; height: 62px; border-radius: 50%; border: 1px solid var(--ink);
    display: grid; place-content: center; font-size: 1.2rem; line-height: 1;
    transition: background .2s, color .2s, transform .2s;
  }
  .cta:hover .circle { background: var(--ink); color: var(--bg); transform: translateX(4px); }
  .cta:active .circle { transform: scale(.96); }
  .cta .caps { line-height: 2.1; text-align: left; }

  /* filteri */
  .bar { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; margin-top: clamp(32px, 6vh, 64px); padding-bottom: 12px; border-bottom: 1px solid var(--ink); }
  .filters { display: flex; gap: clamp(14px, 3vw, 30px); }
  .filters[hidden] { display: none; }
  .tab { background: none; border: 0; padding: 8px 0; cursor: pointer; color: var(--muted); position: relative; }
  .tab::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: 0; background: var(--ink); transition: width .25s; }
  .tab:hover, .tab[aria-pressed="true"] { color: var(--ink); }
  .tab[aria-pressed="true"]::after { width: calc(100% - .32em); }
  .count { color: var(--muted); }
  .count:empty { display: none; }
  .views { display: flex; gap: 32px; margin-top: 28px; border-bottom: 1px solid var(--ink); }
  .view-tab { background: none; border: 0; padding: 12px 0; cursor: pointer; color: var(--muted); position: relative; }
  .view-tab[aria-pressed="true"] { color: var(--ink); }
  .view-tab[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; bottom: -1px; height: 1px; width: 100%; background: var(--ink); }
  .fields.notes-mode { grid-template-columns: 1fr; }
  .note-body { min-height: 100px; resize: vertical; }

  /* lista */
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--grid); transition: opacity .2s, transform .2s; }
  li.removing { opacity: 0; transform: translateX(14px); }
  .check {
    appearance: none; flex: none; width: 30px; height: 30px; margin: 0; border: 1px solid var(--ink); border-radius: 50%;
    cursor: pointer; display: grid; place-content: center; background: transparent; transition: background .18s, transform .16s ease;
  }
  .check:hover { background: rgba(26, 16, 35, .1); }
  .check:checked { background: var(--ink); }
  .check:checked::after { content: ""; width: 6px; height: 11px; margin-top: -2px; border: solid var(--bg); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
  .body { flex: 1; min-width: 0; }
  .text { font-size: 1.3rem; font-weight: 500; letter-spacing: -.02em; overflow-wrap: anywhere; position: relative; width: fit-content; max-width: 100%; transition: color .2s; }
  .text::after { content: ""; position: absolute; left: 0; top: 55%; height: 1.5px; width: 0; background: currentColor; transition: width .28s ease; }
  li.done .text { color: var(--muted); }
  li.done .text::after { width: 100%; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 8px; color: var(--muted); font-size: .74rem; }
  .prio { display: inline-flex; align-items: center; gap: 8px; }
  .prio::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .prio.visok { color: var(--ink); } .prio.visok::before { background: var(--accent); }
  .prio.nizak::before { background: transparent; border: 1px solid var(--muted); }
  .note-content { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--muted); }
  .actions { display: flex; flex: none; align-items: center; gap: 4px; }
  .move, .edit, .del, .tool-button { flex: none; min-height: 42px; border-radius: 22px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; transition: all .18s; }
  .move { padding: 8px 12px; font-family: var(--sans); font-size: .92rem; }
  .move:hover, .edit:hover, .del:hover, .tool-button:hover { border-color: var(--ink); color: var(--ink); }
  .edit { padding: 8px 12px; font-family: var(--sans); font-size: .92rem; }
  .del { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 1px solid transparent; background: none; color: var(--muted); font-size: 1.2rem; line-height: 1; cursor: pointer; transition: all .18s; }
  .edit-form { display: grid; flex: 1; min-width: 0; gap: 14px; }
  .edit-form .field { font-size: 1rem; }
  .edit-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .tool-button { padding: 9px 14px; font: inherit; }
  .tool-status { min-height: 1.5em; margin: 0 0 10px; color: var(--muted); font-size: .95rem; }
  .tool-status:empty { display: none; }
  .auth-card { width: min(520px, 100%); margin: auto; }
  .auth-card h1 { margin-top: 0; font-size: clamp(2.5rem, 6vw, 4.5rem); }
  .auth-card p { color: var(--muted); font-size: 1.1rem; line-height: 1.6; }
  .auth-privacy { display: inline-block; margin-top: 12px; }
  .auth-button { display: inline-flex; align-items: center; gap: 12px; min-height: 52px; padding: 12px 20px; border: 1px solid var(--ink); border-radius: 28px; background: var(--ink); color: var(--bg); font: 600 1rem var(--sans); cursor: pointer; }
  .auth-button:hover:not(:disabled) { background: transparent; color: var(--ink); }
  .auth-button:disabled { opacity: .65; cursor: wait; }
  .account .tool-button { min-height: 36px; }
  .migration { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 20px 0; padding: 14px; border: 1px solid var(--grid); }
  .migration p { margin: 0; color: var(--muted); }
  dialog { width: min(540px, calc(100% - 32px)); max-height: min(80vh, 680px); overflow: auto; padding: 28px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); font: inherit; }
  dialog[open] { animation: dialog-in .22s ease-out both; }
  dialog[open].closing { animation: dialog-out .18s ease-in both; }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog[open]::backdrop { animation: backdrop-in .22s ease-out both; }
  dialog[open].closing::backdrop { animation: backdrop-out .18s ease-in both; }
  @keyframes dialog-in { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes dialog-out { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(10px) scale(.98); } }
  @keyframes backdrop-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes backdrop-out { from { opacity: 1; } to { opacity: 0; } }
  dialog h2 { margin-top: 0; }
  dialog li { display: list-item; padding: 6px 0; border: 0; }
  .dialog-close { display: block; margin: 20px 0 0 auto; }
  .empty { display: block; padding: 26px 0; color: var(--muted); border-bottom: 1px solid var(--grid); }

  .clear { background: none; border: 0; padding: 4px 0; margin-top: 22px; cursor: pointer; color: var(--muted); }
  .clear:hover { color: var(--ink); }

  /* kredit */
  footer { margin-top: auto; padding-top: clamp(36px, 6vh, 64px); }
  .credit { display: flex; flex-wrap: wrap; gap: 8px 36px; align-items: baseline; color: var(--muted); scroll-margin-top: 80px; }
  .credit strong { color: var(--ink); font-weight: 500; }
  .credit a { text-decoration: none; border-bottom: 1px solid var(--grid); padding-bottom: 2px; transition: border-color .2s, color .2s; }
  .credit a:hover { color: var(--ink); border-color: var(--ink); }

  @media (min-width: 721px) {
    .frame { height: calc(100svh - 82px); min-height: 0; }
    .content { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    h1 { margin-top: clamp(12px, 2.4vh, 24px); font-size: clamp(2.8rem, 4vw, 4rem); }
    form { margin-top: clamp(18px, 3.2vh, 30px); gap: 14px; }
    .circle { width: 52px; height: 52px; }
    .bar { margin-top: clamp(18px, 3.2vh, 30px); }
    #zadaci { display: flex; flex: 1; flex-direction: column; min-height: 0; }
    #list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    footer { padding-top: 18px; }
    .tool-button { min-height: 38px; padding: 7px 10px; }
    .tool-status { margin-bottom: 4px; }
  }
  @media (min-width: 721px) and (max-height: 900px) {
    .frame { padding-top: 14px; padding-bottom: 18px; }
    h1 { margin-top: 8px; font-size: clamp(2.5rem, 3.4vw, 3.3rem); }
    .views { margin-top: 12px; }
    .view-tab { padding: 8px 0; }
    form { margin-top: 10px; gap: 8px; }
    .title-input, .field { padding-top: 7px; padding-bottom: 7px; }
    .note-body { min-height: 56px; }
    .circle { width: 44px; height: 44px; }
    .bar { margin-top: 10px; padding-bottom: 6px; }
    li { padding: 8px 0; }
    footer { padding-top: 8px; }
    .tool-button { min-height: 34px; }
  }
  @media (min-width: 721px) and (max-height: 640px) {
    .frame { padding-top: 8px; padding-bottom: 10px; }
    h1 { margin-top: 4px; font-size: clamp(2.2rem, 3vw, 2.5rem); }
    h1 span { font-size: .85em; }
    .views { margin-top: 6px; }
    form { margin-top: 4px; gap: 6px; }
    .title-input, .field { padding-top: 5px; padding-bottom: 5px; }
    .note-body { min-height: 44px; }
    .circle { width: 36px; height: 36px; }
    .bar { margin-top: 6px; }
    footer { padding-top: 4px; }
    .tool-button { min-height: 30px; padding: 5px 8px; }
  }
  @media (max-width: 720px) {
    :root { --gutter: 16px; --cols: 4; }
    .caps { letter-spacing: .16em; font-size: .76rem; }
    header { height: auto; flex-direction: column; padding: 14px 0 6px; gap: 4px; }
    nav { gap: 22px; }
    nav a { padding: 10px 0; }
    .content { margin: 0 auto; text-align: center; }
    .eyebrow::after { margin: 18px auto 0; }
    .title-input, .field, select.field { text-align: center; text-align-last: center; }
    .cta { margin: 0 auto; }
    .bar { justify-content: center; }
    .count { flex-basis: 100%; }
    .text { margin: 0 auto; }
    .meta { justify-content: center; }
    .credit { text-align: center; }
    .frame { padding: 28px 20px 32px; min-height: calc(100svh - 110px); }
    h1 { margin-top: 40px; font-size: clamp(2.7rem, 13vw, 3.8rem); }
    form { margin-top: 36px; }
    .fields { grid-template-columns: 1fr; gap: 18px; }
    .field, select.field { font-size: 17px; padding: 14px 0; }
    .cta { flex-direction: column; gap: 14px; }
    .cta .caps { text-align: center; }
    .filters { gap: 22px; }
    .tab { padding: 10px 0; }
    .views { justify-content: center; margin-top: 24px; }
    li { gap: 12px; padding: 16px 0; }
    .check { width: 30px; height: 30px; }
    .del { width: 44px; height: 44px; }
    .actions { flex-direction: column; }
    .move { min-height: 46px; padding: 9px; }
    .edit { min-height: 46px; padding: 9px; }
    dialog { padding: 22px; text-align: left; }
    .clear { padding: 12px 0; }
    .credit { flex-direction: column; align-items: center; gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="#">NoaHusic-dev</a>
  <div class="account" id="account" hidden>
    <span class="account-email" id="user-email"></span>
    <button class="tool-button caps" id="sign-out" type="button">Odjava</button>
  </div>
  <nav class="caps" id="github-nav" aria-label="Glavna navigacija">
    <a href="https://github.com/NoaHusic-dev" target="_blank" rel="noopener">GitHub</a>
  </nav>
</header>

<main class="frame" id="auth-screen">
  <section class="auth-card" aria-labelledby="auth-title">
    <h1 id="auth-title">Zadaci i bilješke<span>na jednom mjestu</span></h1>
    <p>Prijavi se Google računom i pristupi svojim zadacima i bilješkama s različitih uređaja.</p>
    <button class="auth-button" id="sign-in" type="button" disabled>Učitavam prijavu…</button>
    <p class="tool-status" id="auth-status" role="status" aria-live="polite">Povezivanje s Firebaseom…</p>
    <a class="auth-privacy" href="privatnost.html">Pravila privatnosti</a>
  </section>
</main>

<main class="frame" id="app-shell" hidden>

  <div class="content">
    <section class="migration" id="migration" hidden>
      <p id="migration-message"></p>
      <button class="tool-button" id="migration-button" type="button">Prenesi u račun</button>
    </section>
    <h1>Zadaci i bilješke<span>na jednom mjestu</span></h1>

    <div class="views caps" role="group" aria-label="Prikaz sadržaja">
      <button class="view-tab" type="button" data-view="tasks" aria-pressed="true">Zadaci</button>
      <button class="view-tab" type="button" data-view="notes" aria-pressed="false">Bilješke</button>
    </div>

    <form id="form" autocomplete="off" aria-labelledby="zadaci">
      <input class="title-input" id="title" type="text" placeholder="Što treba napraviti?" maxlength="140" required aria-label="Naslov zadatka">
      <textarea class="field note-body" id="note-body" placeholder="Sadržaj bilješke (neobavezno)" maxlength="2000" aria-label="Sadržaj bilješke" hidden></textarea>
      <div class="fields">
        <input class="field" id="category" type="text" placeholder="Kategorija (neobavezno)" maxlength="24" aria-label="Kategorija">
        <select class="field" id="priority" aria-label="Prioritet" data-priority>
          <option value="nizak">Nizak prioritet</option>
          <option value="srednji" selected>Srednji prioritet</option>
          <option value="visok">Visok prioritet</option>
        </select>
      </div>
      <button class="cta" type="submit">
        <span class="circle" aria-hidden="true">→</span>
        <span class="caps" id="submit-label">Dodaj<br>zadatak</span>
      </button>
    </form>

    <section id="zadaci" aria-label="Popis zadataka">
      <div class="bar">
        <div class="filters caps" role="group" aria-label="Filter zadataka">
          <button class="tab" data-filter="all" aria-pressed="true">Svi</button>
          <button class="tab" data-filter="active" aria-pressed="false">Aktivni</button>
          <button class="tab" data-filter="done" aria-pressed="false">Završeni</button>
        </div>
        <span class="count caps" id="count" aria-live="polite"></span>
      </div>
      <ul id="list"></ul>
      <button class="clear caps" id="clear" type="button" hidden>Obriši završene</button>
    </section>
  </div>

  <footer id="autor">
    <p class="tool-status" id="tool-status" role="status" aria-live="polite"></p>
    <div class="credit caps">
      <a href="https://github.com/NoaHusic-dev" target="_blank" rel="noopener">github.com/NoaHusic-dev</a>
      <a href="privatnost.html">Pravila privatnosti</a>
      <span>&copy; 2026</span>
    </div>
  </footer>
</main>

<script type="module">
const $ = (id) => document.getElementById(id);
const authStatus = $("auth-status");
const setStatus = (message) => { $("tool-status").textContent = message; };

try {
  const [appSdk, authSdk, firestoreSdk] = await Promise.all([
    import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js")
  ]);
  const firebaseConfig = {
    apiKey: "AIzaSyBB9Yhm_SAge2QsQ7V8TBY2_cwY7zuVMwc",
    authDomain: "todo-2fff8.firebaseapp.com",
    projectId: "todo-2fff8",
    appId: "1:479116317561:web:d6b8c1d628db0d9ea395a8"
  };
  const app = appSdk.initializeApp(firebaseConfig);
  const auth = authSdk.getAuth(app);
  const db = firestoreSdk.getFirestore(app);
  const googleProvider = new authSdk.GoogleAuthProvider();
  const PRIO = { visok: "Visok prioritet", srednji: "Srednji prioritet", nizak: "Nizak prioritet" };
  const list = $("list");
  let todos = [];
  let filter = "all";
  let view = "tasks";
  let currentUser = null;
  let itemsRef = null;
  let unsubscribeItems = null;
  let legacyItems = [];

  function counts() {
    const items = todos.filter(t => view === "notes" ? t.type === "note" : t.type !== "note");
    const left = items.filter(t => !t.done).length;
    $("count").textContent = items.length
      ? view === "notes" ? `Bilješki ${items.length}` : `Preostalo ${left}/${items.length}`
      : "";
    $("clear").hidden = view === "notes" || !items.some(t => t.done);
  }

  function render() {
    const items = todos.filter(t => view === "notes" ? t.type === "note" : t.type !== "note");
    const visible = view === "notes" ? items : items.filter(t => filter === "all" ? true : filter === "done" ? t.done : !t.done);
    list.replaceChildren();
    if (!visible.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = view === "notes"
        ? "Još nema bilješki. Dodaj novu ili prebaci zadatak u bilješke."
        : items.length ? "Nema zadataka u ovom prikazu." : "Još nema zadataka. Upiši prvi iznad.";
      list.append(li);
    }
    for (const t of visible) {
      const li = document.createElement("li");
      li.className = view === "tasks" && t.done ? "done" : "";
      li.dataset.id = t.id;

      if (view === "tasks") {
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.className = "check"; cb.checked = t.done;
        cb.setAttribute("aria-label", "Završeno: " + t.title);
        li.append(cb);
      }

      const body = document.createElement("div"); body.className = "body";
      const text = document.createElement("div"); text.className = "text"; text.textContent = t.title;
      const meta = document.createElement("div"); meta.className = "meta caps";
      if (view === "tasks") {
        const p = document.createElement("span"); p.className = "prio " + t.priority; p.textContent = PRIO[t.priority];
        meta.append(p);
      }
      if (t.category) { const c = document.createElement("span"); c.textContent = t.category; meta.append(c); }
      body.append(text);
      if (view === "notes" && t.body) {
        const noteContent = document.createElement("div");
        noteContent.className = "note-content";
        noteContent.textContent = t.body;
        body.append(noteContent);
      }
      if (meta.childElementCount) body.append(meta);

      const del = document.createElement("button");
      del.className = "del"; del.type = "button"; del.textContent = "×";
      del.setAttribute("aria-label", (view === "notes" ? "Obriši bilješku: " : "Obriši zadatak: ") + t.title);

      li.append(body);
      const actions = document.createElement("div");
      actions.className = "actions";
      const edit = document.createElement("button");
      edit.className = "edit"; edit.type = "button"; edit.textContent = "Uredi";
      edit.setAttribute("aria-label", (view === "notes" ? "Uredi bilješku: " : "Uredi zadatak: ") + t.title);
      actions.append(edit);
      if (view === "tasks") {
        const move = document.createElement("button");
        move.className = "move"; move.type = "button"; move.textContent = "U bilješke";
        move.setAttribute("aria-label", "Prebaci u bilješke: " + t.title);
        actions.append(move);
      }
      actions.append(del);
      li.append(actions);
      list.append(li);
    }
    counts();
  }

  function showError(action, error) {
    console.error(action, error);
    const message = `${action}: ${error.message || error}`;
    if ($("app-shell").hidden) authStatus.textContent = message;
    else setStatus(message);
  }

  function itemDocument(id) {
    return firestoreSdk.doc(db, "users", currentUser.uid, "items", id);
  }

  function inspectLegacyItems() {
    const panel = $("migration");
    try {
      const saved = localStorage.getItem("todo.zadaci.v1");
      legacyItems = saved ? JSON.parse(saved) : [];
      if (!Array.isArray(legacyItems)) throw new Error("Stari podaci nisu u očekivanom formatu.");
      legacyItems = legacyItems.filter(item => item && typeof item.title === "string" && item.title.trim());
      panel.hidden = legacyItems.length === 0;
      $("migration-message").textContent = legacyItems.length
        ? `Pronađeno je ${legacyItems.length} lokalnih stavki. Možeš ih prenijeti u svoj račun.`
        : "";
    } catch (error) {
      panel.hidden = true;
      showError("Stare podatke nije moguće pročitati", error);
    }
  }

  $("migration-button").addEventListener("click", async () => {
    if (!currentUser || !legacyItems.length) return;
    if (!confirm(`Prenijeti ${legacyItems.length} starih stavki u račun ${currentUser.email || ""}?`)) return;
    $("migration-button").disabled = true;
    try {
      for (let offset = 0; offset < legacyItems.length; offset += 400) {
        const batch = firestoreSdk.writeBatch(db);
        const chunk = legacyItems.slice(offset, offset + 400);
        const writes = await Promise.all(chunk.map(async (item, index) => {
          const legacyId = encodeURIComponent(String(item.id || "item"));
          const reference = firestoreSdk.doc(itemsRef, `legacy_${legacyId}_${offset + index}`);
          if ((await firestoreSdk.getDoc(reference)).exists()) return null;
          const type = item.type === "note" ? "note" : "task";
          const data = {
            type,
            title: item.title.trim().slice(0, 140),
            category: typeof item.category === "string" ? item.category.slice(0, 24) : "",
            createdAt: firestoreSdk.serverTimestamp(),
            updatedAt: firestoreSdk.serverTimestamp()
          };
          if (type === "note") data.body = typeof item.body === "string" ? item.body.slice(0, 2000) : "";
          else {
            data.done = Boolean(item.done);
            data.priority = PRIO[item.priority] ? item.priority : "srednji";
          }
          return { reference, data };
        }));
        writes.filter(Boolean).forEach(write => batch.set(write.reference, write.data));
        if (writes.some(Boolean)) await batch.commit();
      }
      localStorage.removeItem("todo.zadaci.v1");
      legacyItems = [];
      $("migration").hidden = true;
      setStatus("Stari zadaci i bilješke preneseni su u tvoj račun.");
    } catch (error) {
      showError("Prijenos starih stavki nije uspio", error);
    } finally {
      $("migration-button").disabled = false;
    }
  });

  $("sign-in").addEventListener("click", async () => {
    const button = $("sign-in");
    button.disabled = true;
    authStatus.textContent = "Otvaram Google prijavu…";
    try {
      if (matchMedia("(max-width: 720px)").matches) {
        await authSdk.signInWithRedirect(auth, googleProvider);
      } else {
        await authSdk.signInWithPopup(auth, googleProvider);
      }
    } catch (error) {
      if (error.code === "auth/popup-blocked" || error.code === "auth/operation-not-supported-in-this-environment") {
        try {
          await authSdk.signInWithRedirect(auth, googleProvider);
          return;
        } catch (redirectError) {
          showError("Google prijava nije uspjela", redirectError);
        }
      } else {
        showError("Google prijava nije uspjela", error);
      }
      button.disabled = false;
    }
  });

  $("sign-out").addEventListener("click", async () => {
    try {
      await authSdk.signOut(auth);
      setStatus("");
    } catch (error) {
      showError("Odjava nije uspjela", error);
    }
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = $("title").value.trim();
    if (!title || !currentUser || !itemsRef) return;
    const item = {
      type: view === "notes" ? "note" : "task",
      title,
      category: $("category").value.trim(),
      createdAt: firestoreSdk.serverTimestamp(),
      updatedAt: firestoreSdk.serverTimestamp()
    };
    if (view === "notes") item.body = $("note-body").value.trim();
    else {
      item.priority = $("priority").value;
      item.done = false;
    }
    try {
      await firestoreSdk.addDoc(itemsRef, item);
      $("title").value = "";
      $("category").value = "";
      $("note-body").value = "";
      $("title").focus();
      setStatus("");
    } catch (error) {
      showError("Spremanje nije uspjelo", error);
    }
  });

  list.addEventListener("click", async (e) => {
    const li = e.target.closest("li[data-id]");
    if (!li) return;
    const t = todos.find(x => x.id === li.dataset.id);
    if (!t) return;
    if (e.target.matches(".edit")) {
      const editor = document.createElement("form");
      editor.className = "edit-form";
      const titleInput = document.createElement("input");
      titleInput.className = "title-input"; titleInput.name = "title"; titleInput.maxLength = 140;
      titleInput.required = true; titleInput.value = t.title;
      titleInput.setAttribute("aria-label", "Naslov");
      editor.append(titleInput);
      if (t.type === "note") {
        const content = document.createElement("textarea");
        content.className = "field note-body"; content.name = "body"; content.maxLength = 2000;
        content.value = t.body || ""; content.setAttribute("aria-label", "Sadržaj bilješke");
        editor.append(content);
      }
      const fields = document.createElement("div");
      fields.className = "fields" + (t.type === "note" ? " notes-mode" : "");
      const category = document.createElement("input");
      category.className = "field"; category.name = "category"; category.maxLength = 24;
      category.value = t.category || ""; category.placeholder = "Kategorija (neobavezno)";
      category.setAttribute("aria-label", "Kategorija");
      fields.append(category);
      if (t.type !== "note") {
        const priority = document.createElement("select");
        priority.className = "field"; priority.name = "priority";
        priority.setAttribute("aria-label", "Prioritet");
        for (const [value, label] of Object.entries(PRIO)) {
          const option = document.createElement("option");
          option.value = value; option.textContent = label; option.selected = value === t.priority;
          priority.append(option);
        }
        fields.append(priority);
      }
      editor.append(fields);
      const editActions = document.createElement("div");
      editActions.className = "edit-actions";
      const saveEdit = document.createElement("button");
      saveEdit.className = "tool-button"; saveEdit.type = "submit"; saveEdit.textContent = "Spremi";
      const cancelEdit = document.createElement("button");
      cancelEdit.className = "tool-button"; cancelEdit.type = "button"; cancelEdit.textContent = "Odustani";
      editActions.append(saveEdit, cancelEdit);
      editor.append(editActions);
      li.replaceChildren(editor);
      titleInput.focus();
    } else if (e.target.matches(".edit-form button[type=button]")) {
      render();
    } else if (e.target.matches(".check")) {
      try {
        await firestoreSdk.updateDoc(itemDocument(t.id), {
          done: e.target.checked,
          updatedAt: firestoreSdk.serverTimestamp()
        });
      } catch (error) {
        showError("Ažuriranje zadatka nije uspjelo", error);
      }
    } else if (e.target.matches(".move")) {
      try {
        await firestoreSdk.updateDoc(itemDocument(t.id), {
          type: "note",
          body: "",
          done: firestoreSdk.deleteField(),
          priority: firestoreSdk.deleteField(),
          updatedAt: firestoreSdk.serverTimestamp()
        });
      } catch (error) {
        showError("Premještanje u Bilješke nije uspjelo", error);
      }
    } else if (e.target.matches(".del")) {
      li.classList.add("removing");
      await new Promise(resolve => setTimeout(resolve, 200));
      try {
        await firestoreSdk.deleteDoc(itemDocument(t.id));
      } catch (error) {
        li.classList.remove("removing");
        showError("Brisanje nije uspjelo", error);
      }
    }
  });

  list.addEventListener("submit", async (e) => {
    if (!e.target.matches(".edit-form")) return;
    e.preventDefault();
    const li = e.target.closest("li[data-id]");
    const item = todos.find(x => x.id === li.dataset.id);
    if (!item) return;
    const data = new FormData(e.target);
    const updated = {
      title: data.get("title").trim(),
      category: data.get("category").trim(),
      updatedAt: firestoreSdk.serverTimestamp()
    };
    if (item.type === "note") updated.body = data.get("body").trim();
    else updated.priority = data.get("priority");
    try {
      await firestoreSdk.updateDoc(itemDocument(item.id), updated);
    } catch (error) {
      showError("Uređivanje nije uspjelo", error);
    }
  });

  $("clear").addEventListener("click", async () => {
    const completed = todos.filter(item => item.type !== "note" && item.done);
    try {
      for (let offset = 0; offset < completed.length; offset += 400) {
        const batch = firestoreSdk.writeBatch(db);
        completed.slice(offset, offset + 400).forEach(item => batch.delete(itemDocument(item.id)));
        await batch.commit();
      }
    } catch (error) {
      showError("Brisanje završenih zadataka nije uspjelo", error);
    }
  });

  document.querySelector(".views").addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]");
    if (!b) return;
    view = b.dataset.view;
    document.querySelectorAll("[data-view]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("title").placeholder = view === "notes" ? "Naslov bilješke" : "Što treba napraviti?";
    $("title").setAttribute("aria-label", view === "notes" ? "Naslov bilješke" : "Naslov zadatka");
    $("submit-label").textContent = view === "notes" ? "Dodaj bilješku" : "Dodaj zadatak";
    $("zadaci").setAttribute("aria-label", view === "notes" ? "Popis bilješki" : "Popis zadataka");
    $("note-body").hidden = view !== "notes";
    $("priority").hidden = view === "notes";
    document.querySelector(".fields").classList.toggle("notes-mode", view === "notes");
    document.querySelector(".filters").hidden = view === "notes";
    filter = "all";
    document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.filter === filter)));
    render();
  });

  document.querySelector(".filters").addEventListener("click", (e) => {
    const b = e.target.closest("[data-filter]");
    if (!b) return;
    filter = b.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });

  $("sign-in").disabled = false;
  $("sign-in").textContent = "Nastavi s Googleom";
  authStatus.textContent = "Tvoji podaci sinkroniziraju se uz tvoj Google račun.";

  authSdk.getRedirectResult(auth).catch(error => {
    showError("Google prijava nije uspjela", error);
  });

  authSdk.onAuthStateChanged(auth, user => {
    currentUser = user;
    if (unsubscribeItems) unsubscribeItems();
    unsubscribeItems = null;
    todos = [];
    render();
    $("auth-screen").hidden = Boolean(user);
    $("app-shell").hidden = !user;
    $("account").hidden = !user;
    $("github-nav").hidden = Boolean(user);
    if (!user) {
      itemsRef = null;
      $("migration").hidden = true;
      $("sign-in").disabled = false;
      return;
    }
    $("user-email").textContent = user.displayName || user.email || "Google račun";
    itemsRef = firestoreSdk.collection(db, "users", user.uid, "items");
    inspectLegacyItems();
    unsubscribeItems = firestoreSdk.onSnapshot(itemsRef, snapshot => {
      todos = snapshot.docs
        .map(document => ({ id: document.id, ...document.data() }))
        .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      render();
    }, error => {
      showError("Učitavanje zadataka i bilješki nije uspjelo", error);
    });
  });
} catch (error) {
  console.error("Firebase initialization failed", error);
  $("sign-in").disabled = true;
  $("sign-in").textContent = "Prijava nije dostupna";
  authStatus.textContent = `Firebase se nije mogao učitati: ${error.message || error}`;
}
</script>
</body>
</html>
